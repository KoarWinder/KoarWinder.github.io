<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr_Larp — Донат</title>
<style>
  :root { --accent: 255, 107, 129; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    display: grid;
    place-items: center;
    background: #0a0a0f;
    color: #ededf2;
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* интерактивный фон: сеть частиц, реагирует на курсор */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* мягкий свет, идущий за курсором */
  .spot {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(520px circle at var(--mx, 50%) var(--my, 50%),
                rgba(var(--accent), .045), transparent 60%);
  }
  .spot::after {   /* второе, тёплое пятно с задержкой — даёт глубину и мягкий шлейф */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), rgba(255,170,80,.025), transparent 70%);
  }
  body { animation: fadein 1.4s ease both; }
  @keyframes fadein { from { opacity: 0; } }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.65) 100%);
  }

  main { position: relative; z-index: 2; text-align: center; padding: 24px; }

  .card {
    padding: 56px clamp(32px, 7vw, 84px);
    border-radius: 28px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 600;
    letter-spacing: -.02em;
  }
  p {
    margin: 0 0 36px;
    color: rgba(237,237,242,.55);
    font-size: 16px;
  }

  .donate {
    --x: 50%; --y: 50%;
    position: relative;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 44px;
    font-size: 17px; font-weight: 600;
    color: #0a0a0f;
    text-decoration: none;
    border-radius: 14px;
    background: #ededf2;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
    box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 10px 30px rgba(0,0,0,.4);
  }
  .donate::before {   /* подсветка под курсором внутри кнопки */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(140px circle at var(--x) var(--y), rgba(var(--accent), .3), transparent 70%);
    opacity: 0; transition: opacity .3s;
  }
  .donate:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(var(--accent), .6), 0 16px 40px rgba(var(--accent), .25); }
  .donate:hover::before { opacity: 1; }
  .donate:active { transform: translateY(0) scale(.98); }
  .donate span { position: relative; }
  .donate {
    padding: 22px 80px; font-size: 22px; letter-spacing: .06em; text-transform: uppercase;
    border-radius: 18px;
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both, breathe 4s ease-in-out 1s infinite;
  }
  .donate::after {   /* блик */
    content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.9), transparent);
    transform: skewX(-20deg);
    animation: sweep 4s ease-in-out 1.5s infinite;
  }
  .ripple {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: rgba(var(--accent), .45);
    transform: scale(0); animation: ripple .7s ease-out forwards;
  }
  main { display: grid; place-items: center; }
  .halo {   /* вращающееся свечение за кнопкой */
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, rgba(var(--accent), .16), transparent 40%, rgba(255,160,90,.1), transparent 80%);
    filter: blur(50px);
    animation: spin 10s linear infinite;
    pointer-events: none;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.92); } }
  @keyframes breathe { 50% { box-shadow: 0 0 0 1px rgba(var(--accent), .35), 0 14px 40px rgba(var(--accent), .18); } }
  .card { padding: 30px 34px; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .heart { display: inline-block; margin-right: 12px; color: rgb(var(--accent)); animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } }
  @keyframes sweep { 0%, 60% { left: -80%; } 100% { left: 160%; } }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="spot"></div>
  <div class="vignette"></div>

  <main>
    <div class="halo"></div>
    <div class="card">
      <a id="btn" class="donate" href="https://www.donationalerts.com/r/mr_larp" target="_blank" rel="noopener">
        <span><span class="heart">❤</span>Донат</span>
      </a>
    </div>
  </main>

<script>
  const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  const btn = document.getElementById('btn');
  let W, H, dpr, pts = [];
  const mouse = { x: -9999, y: -9999 };
  const A = '255,107,129';
  // сглаженные координаты: свет и кнопка плавно догоняют курсор
  const tgt = { x: innerWidth / 2, y: innerHeight / 2 }, cur = { x: tgt.x, y: tgt.y };
  const mag = { tx: 0, ty: 0, x: 0, y: 0 };

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(Math.floor(W * H / 14000), 110);
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25,
      r: Math.random() * 1.4 + .6
    }));
  }
  addEventListener('resize', resize); resize();

  addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    tgt.x = e.clientX; tgt.y = e.clientY;
  });
  addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });
  btn.addEventListener('mousemove', e => {
    const r = btn.getBoundingClientRect();
    btn.style.setProperty('--x', (e.clientX - r.left) + 'px');
    btn.style.setProperty('--y', (e.clientY - r.top) + 'px');
  });
  // кнопка слегка «магнитится» к курсору
  addEventListener('mousemove', e => {
    const r = btn.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d < 240) { mag.tx = dx * .14; mag.ty = dy * .14; }
    else { mag.tx = 0; mag.ty = 0; }
  });
  // волна по клику
  btn.addEventListener('click', e => {
    const r = btn.getBoundingClientRect(), s = document.createElement('i');
    s.className = 'ripple';
    s.style.cssText = `width:60px;height:60px;left:${e.clientX - r.left - 30}px;top:${e.clientY - r.top - 30}px`;
    btn.appendChild(s); setTimeout(() => s.remove(), 700);
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * 6.283, v = 1 + Math.random() * 3;
      sparks.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 });
    }
  });
  // шлейф за курсором и искры
  const sparks = [];
  addEventListener('mousemove', e => {
    sparks.push({ x: e.clientX, y: e.clientY, vx: (Math.random() - .5) * .6, vy: (Math.random() - .5) * .6, life: .8 });
  });

  (function loop() {
    // плавное следование (lerp)
    cur.x += (tgt.x - cur.x) * .08; cur.y += (tgt.y - cur.y) * .08;
    mag.x += (mag.tx - mag.x) * .12; mag.y += (mag.ty - mag.y) * .12;
    const rs = document.documentElement.style;
    rs.setProperty('--mx', cur.x + 'px'); rs.setProperty('--my', cur.y + 'px');
    btn.style.translate = `${mag.x}px ${mag.y}px`;
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      // лёгкое отталкивание от курсора
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
      if (d < 140) { p.vx += dx / d * .03; p.vy += dy / d * .03; }
      p.vx *= .99; p.vy *= .99;
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    // линии между близкими точками и к курсору
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
        if (d < 120) {
          ctx.strokeStyle = `rgba(255,255,255,${(1 - d / 120) * .12})`;
          ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
        }
      }
      const dm = Math.hypot(pts[i].x - mouse.x, pts[i].y - mouse.y);
      if (dm < 200) {
        ctx.strokeStyle = `rgba(${A},${(1 - dm / 200) * .6})`;
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.life -= .02;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(${A},${s.life})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, 1 + s.life * 2, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
