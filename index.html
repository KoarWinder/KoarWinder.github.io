<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr_Larp — Донат</title>
<style>
  :root { --accent: 255, 107, 129; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    display: grid;
    place-items: center;
    background: #0a0a0f;
    color: #ededf2;
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* интерактивный фон: сеть частиц, реагирует на курсор */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* мягкий свет, идущий за курсором */
  .spot {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(520px circle at var(--mx, 50%) var(--my, 50%),
                rgba(var(--accent), .045), transparent 60%);
  }
  .spot::after {   /* второе, тёплое пятно с задержкой — даёт глубину и мягкий шлейф */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), rgba(255,170,80,.025), transparent 70%);
  }
  body { animation: fadein 1.4s ease both; }
  @keyframes fadein { from { opacity: 0; } }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.65) 100%);
  }

  main { position: relative; z-index: 2; text-align: center; padding: 24px; }

  .card {
    padding: 56px clamp(32px, 7vw, 84px);
    border-radius: 28px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 600;
    letter-spacing: -.02em;
  }
  p {
    margin: 0 0 36px;
    color: rgba(237,237,242,.55);
    font-size: 16px;
  }

  .donate {
    --x: 50%; --y: 50%;
    position: relative;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 44px;
    font-size: 17px; font-weight: 600;
    color: #0a0a0f;
    text-decoration: none;
    border-radius: 14px;
    background: #ededf2;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
    box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 10px 30px rgba(0,0,0,.4);
  }
  .donate::before {   /* подсветка под курсором внутри кнопки */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(140px circle at var(--x) var(--y), rgba(var(--accent), .3), transparent 70%);
    opacity: 0; transition: opacity .3s;
  }
  .donate:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(var(--accent), .6), 0 16px 40px rgba(var(--accent), .25); }
  .donate:hover::before { opacity: 1; }
  .donate:active { transform: translateY(0) scale(.98); }
  .donate span, .donate svg { position: relative; }
  .donate {
    padding: 22px 80px; font-size: 22px; letter-spacing: .06em; text-transform: uppercase;
    border-radius: 18px;
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both, breathe 4s ease-in-out 1s infinite;
  }
  .donate::after {   /* блик */
    content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.9), transparent);
    transform: skewX(-20deg);
    animation: sweep 4s ease-in-out 1.5s infinite;
  }
  .ripple {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: rgba(var(--accent), .45);
    transform: scale(0); animation: ripple .7s ease-out forwards;
  }
  main { display: grid; place-items: center; }
  .halo {   /* вращающееся свечение за кнопкой */
    position: absolute; width: 420px; height: 420px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, rgba(var(--accent), .16), transparent 40%, rgba(255,160,90,.1), transparent 80%);
    filter: blur(50px);
    animation: spin 10s linear infinite;
    pointer-events: none;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.92); } }
  @keyframes breathe { 50% { box-shadow: 0 0 0 1px rgba(var(--accent), .35), 0 14px 40px rgba(var(--accent), .18); } }
  .card { padding: 30px 34px; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .heart { display: inline-block; margin-right: 12px; color: rgb(var(--accent)); animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } }
  @keyframes sweep { 0%, 60% { left: -80%; } 100% { left: 160%; } }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  /* скрытая консоль статистики: ` (Ё) на клавиатуре или 5 быстрых тапов в левом верхнем углу */
  .term {
    position: fixed; left: 50%; bottom: 18px; z-index: 20;
    width: min(94vw, 720px); height: 300px;
    translate: -50% 130%; opacity: 0; pointer-events: none;
    display: flex; flex-direction: column;
    background: rgba(12, 12, 20, .72);
    -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid rgba(255,255,255,.12); border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
    font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; color: #e8e8f0;
    transition: translate .45s cubic-bezier(.2,.8,.2,1), opacity .3s;
  }
  .term.open { translate: -50% 0; opacity: 1; pointer-events: auto; }
  .term-out { flex: 1; overflow-y: auto; padding: 14px 16px 6px; white-space: pre-wrap; word-break: break-word; }
  .term-out .dim { color: rgba(232,232,240,.5); }
  .term-out .ok { color: #6ee7a0; }
  .term-out .err { color: #ff7a8c; }
  .term-out .hl { color: rgb(var(--accent)); }
  .term-in { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid rgba(255,255,255,.08); }
  .term-in span { color: rgb(var(--accent)); }
  .term-in input { flex: 1; background: none; border: 0; outline: 0; color: inherit; font: inherit; }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="spot"></div>
  <div class="vignette"></div>

  <main>
    <div class="halo"></div>
    <div class="card">
      <a id="btn" class="donate" href="https://dalink.to/mr_larp" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3 5 6.3 5c2 0 3.5 1.1 4.2 2.4h3C14.2 6.1 15.7 5 17.7 5 21 5 23 8.200 21.500 11.800 19.500 16.400 12 21 12 21z"/></svg>
        <span>Донат</span>
      </a>
    </div>
  </main>

  <div class="term" id="term" aria-hidden="true">
    <div class="term-out" id="termOut"></div>
    <label class="term-in"><span>&gt;</span><input id="termIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Консоль"></label>
  </div>

<script>
  const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  const btn = document.getElementById('btn');
  let W, H, dpr, pts = [];
  const mouse = { x: -9999, y: -9999 };
  const A = '255,107,129';
  // сглаженные координаты: свет и кнопка плавно догоняют курсор
  const tgt = { x: innerWidth / 2, y: innerHeight / 2 }, cur = { x: tgt.x, y: tgt.y };
  const mag = { tx: 0, ty: 0, x: 0, y: 0 };

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(Math.floor(W * H / 14000), 110);
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25,
      r: Math.random() * 1.4 + .6
    }));
  }
  addEventListener('resize', resize); resize();

  addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    tgt.x = e.clientX; tgt.y = e.clientY;
  });
  addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });
  btn.addEventListener('mousemove', e => {
    const r = btn.getBoundingClientRect();
    btn.style.setProperty('--x', (e.clientX - r.left) + 'px');
    btn.style.setProperty('--y', (e.clientY - r.top) + 'px');
  });
  // кнопка слегка «магнитится» к курсору
  addEventListener('mousemove', e => {
    const r = btn.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d < 240) { mag.tx = dx * .14; mag.ty = dy * .14; }
    else { mag.tx = 0; mag.ty = 0; }
  });
  // волна по клику
  btn.addEventListener('click', e => {
    const r = btn.getBoundingClientRect(), s = document.createElement('i');
    s.className = 'ripple';
    s.style.cssText = `width:60px;height:60px;left:${e.clientX - r.left - 30}px;top:${e.clientY - r.top - 30}px`;
    btn.appendChild(s); setTimeout(() => s.remove(), 700);
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * 6.283, v = 1 + Math.random() * 3;
      sparks.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 });
    }
  });
  // шлейф за курсором и искры
  const sparks = [];
  addEventListener('mousemove', e => {
    sparks.push({ x: e.clientX, y: e.clientY, vx: (Math.random() - .5) * .6, vy: (Math.random() - .5) * .6, life: .8 });
  });

  (function loop() {
    // плавное следование (lerp)
    cur.x += (tgt.x - cur.x) * .08; cur.y += (tgt.y - cur.y) * .08;
    mag.x += (mag.tx - mag.x) * .12; mag.y += (mag.ty - mag.y) * .12;
    const rs = document.documentElement.style;
    rs.setProperty('--mx', cur.x + 'px'); rs.setProperty('--my', cur.y + 'px');
    btn.style.translate = `${mag.x}px ${mag.y}px`;
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      // лёгкое отталкивание от курсора
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
      if (d < 140) { p.vx += dx / d * .03; p.vy += dy / d * .03; }
      p.vx *= .99; p.vy *= .99;
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    // линии между близкими точками и к курсору
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
        if (d < 120) {
          ctx.strokeStyle = `rgba(255,255,255,${(1 - d / 120) * .12})`;
          ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
        }
      }
      const dm = Math.hypot(pts[i].x - mouse.x, pts[i].y - mouse.y);
      if (dm < 200) {
        ctx.strokeStyle = `rgba(${A},${(1 - dm / 200) * .6})`;
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.life -= .02;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(${A},${s.life})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, 1 + s.life * 2, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(loop);
  })();
</script>

<script>
/* ===== статистика и скрытая консоль =====
   Счётчики общие для всех посетителей: хранятся на публичном сервисе abacus.jasoncameron.dev
   (в нём только числа, без профилей). Код разблокировки хранится как хэш SHA-256 —
   это защита «от любопытных», а не настоящая безопасность: сайт статический, исходник открыт. */
(() => {
  const NS = 'koarwinder-github-io', API = 'https://abacus.jasoncameron.dev';
  const OFFSET = [8, 8, 0];   // тестовые заходы при разработке (visits, unique, clicks) — вычитаются из статистики
  const SALT = 'larp:', HASH = '692205fd778f536ace90e1562b8c6d1929ccbb96409f48165a9f3b76a3f4defd';
  const LS = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
    del: k => { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const SS = {
    get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} }
  };
  const dnt = navigator.doNotTrack === '1' || navigator.globalPrivacyControl === true;   // уважаем «Не отслеживать»
  const isOwner = () => LS.get('lg_owner') === '1';
  let memUnlocked = false;   // на случай, когда браузер не даёт писать в localStorage
  const unlocked = () => memUnlocked || LS.get('lg_unlocked') === '1';

  // локальный журнал событий на этом устройстве
  let log = []; try { log = JSON.parse(LS.get('lg_log') || '[]'); } catch (e) {}
  const addLog = t => { log.push({ t, at: Date.now() }); log = log.slice(-60); LS.set('lg_log', JSON.stringify(log)); };

  const api = async (op, key) => {
    try {
      const r = await fetch(`${API}/${op}/${NS}/${key}`);
      if (r.status === 404) return 0;
      return (await r.json()).value;
    } catch (e) { return null; }
  };

  // ---- подсчёт ----
  const counting = !dnt && !isOwner() && !/[?&]nocount/.test(location.search);   // ?nocount — открыть сайт без подсчёта
  if (counting) {
    if (!SS.get('lg_session')) { SS.set('lg_session', '1'); api('hit', 'visits'); addLog('visit'); }
    if (!LS.get('lg_seen')) { LS.set('lg_seen', String(Date.now())); api('hit', 'unique'); }
  }
  document.getElementById('btn').addEventListener('click', () => {
    if (!counting) return;
    api('hit', 'clicks'); addLog('click');
  });

  // ---- консоль ----
  const term = document.getElementById('term'), out = document.getElementById('termOut'), inp = document.getElementById('termIn');
  const print = (text, cls) => {
    const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text; out.appendChild(d); out.scrollTop = out.scrollHeight;
  };
  // SHA-256: нативный, а если страница открыта не по https (нет crypto.subtle) — запасная реализация
  function sha256js(str) {
    const rr = (v, n) => (v >>> n) | (v << (32 - n)), K = [], H = [];
    let p = 2, c = 0;
    const frac = x => (x - Math.floor(x)) * 4294967296 | 0;
    for (; c < 64; p++) { let ok = true; for (let i = 2; i * i <= p; i++) if (p % i === 0) { ok = false; break; } if (ok) { if (c < 8) H[c] = frac(Math.pow(p, .5)); K[c++] = frac(Math.pow(p, 1 / 3)); } }
    const bytes = [...new TextEncoder().encode(str)], len = bytes.length * 8;
    bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (len >>> (i * 8)) & 255);
    for (let o = 0; o < bytes.length; o += 64) {
      const w = [];
      for (let i = 0; i < 16; i++) w[i] = (bytes[o + 4 * i] << 24) | (bytes[o + 4 * i + 1] << 16) | (bytes[o + 4 * i + 2] << 8) | bytes[o + 4 * i + 3];
      for (let i = 16; i < 64; i++) {
        const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let [a, b, cc, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + cc) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    return H.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
  }
  const sha = async s => {
    try {
      if (window.crypto && crypto.subtle) return [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {}
    return sha256js(s);
  };
  const fmtDate = ms => new Date(ms).toLocaleString('ru-RU');
  const fmt = v => v === null ? 'нет связи' : String(v);

  async function unlock(code) {
    if (!code) return 'Использование: unlock <код>';
    if (await sha(SALT + code) !== HASH) return null;
    memUnlocked = true; LS.set('lg_unlocked', '1'); LS.set('lg_owner', '1');
    return 'Статистика разблокирована. Твои визиты и клики на этом устройстве больше не считаются.';
  }
  async function stats() {
    if (!unlocked()) return 'Статистика закрыта. Введи: unlock <код>';
    const raw = await Promise.all([api('get', 'visits'), api('get', 'unique'), api('get', 'clicks')]);
    const [visits, unique, clicks] = raw.map((v, i) => v === null ? null : Math.max(0, v - OFFSET[i]));
    const rate = visits ? ((clicks / visits) * 100).toFixed(1) + '%' : '—';
    const lines = [
      'ВСЕ ПОСЕТИТЕЛИ',
      `  визитов (сессий):    ${fmt(visits)}`,
      `  уникальных устройств: ${fmt(unique)}`,
      `  нажатий на «Донат»:   ${fmt(clicks)}`,
      `  конверсия:            ${rate}`,
      '',
      'ЭТО УСТРОЙСТВО',
      `  первый заход: ${LS.get('lg_seen') ? fmtDate(+LS.get('lg_seen')) : '—'}`,
      `  последние события:`
    ];
    log.slice(-8).reverse().forEach(e => lines.push(`    ${fmtDate(e.at)}  ${e.t === 'click' ? 'клик по кнопке' : 'визит'}`));
    if (!log.length) lines.push('    пока пусто');
    return lines.join('\n');
  }
  window.larp = {
    unlock: async code => { const r = await unlock(code); console.log(r || 'Неверный код'); return !!r; },
    stats: async () => { console.log(await stats()); },
    lock: () => { memUnlocked = false; LS.del('lg_unlocked'); console.log('Закрыто'); }
  };

  const help = [
    'help            — список команд',
    'unlock <код>    — открыть статистику',
    'stats           — показать статистику',
    'lock            — закрыть статистику',
    'hash <текст>    — SHA-256 для нового кода (см. HASH в исходнике)',
    'clear           — очистить экран',
    'exit            — закрыть консоль'
  ].join('\n');

  const run = async line => {
    const [cmd, ...rest] = line.trim().split(/\s+/); const arg = rest.join(' ');
    switch ((cmd || '').toLowerCase()) {
      case '': return;
      case 'help': case '?': print(help); break;
      case 'unlock': {
        const r = await unlock(arg); r ? print(r, 'ok') : print('Неверный код', 'err'); break;
      }
      case 'stats': print('загружаю…', 'dim'); out.lastChild.remove(); print(await stats(), unlocked() ? 'hl' : 'err'); break;
      case 'lock': memUnlocked = false; LS.del('lg_unlocked'); print('Статистика закрыта', 'ok'); break;
      case 'hash': print(arg ? await sha(SALT + arg) : 'Использование: hash <текст>'); break;
      case 'clear': out.textContent = ''; break;
      case 'exit': case 'close': toggle(false); break;
      default: print(`Неизвестная команда: ${cmd}. Введи help`, 'err');
    }
  };

  function toggle(open) {
    open = open === undefined ? !term.classList.contains('open') : open;
    term.classList.toggle('open', open); term.setAttribute('aria-hidden', String(!open));
    if (open) { if (!out.childElementCount) { print('LARP CONSOLE', 'hl'); print('help — список команд', 'dim'); } setTimeout(() => inp.focus(), 350); }
    else inp.blur();
  }

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const v = inp.value; inp.value = '';
      if (v.trim()) print('> ' + (/^unlock\s/i.test(v) ? 'unlock ••••' : v), 'dim');
      run(v).catch(err => print('Ошибка: ' + err.message, 'err'));
    }
    if (e.key === 'Escape') toggle(false);
    e.stopPropagation();
  });
  addEventListener('keydown', e => {
    if (e.code === 'Backquote' && document.activeElement !== inp) { e.preventDefault(); toggle(); }
  });
  // для телефона: 5 быстрых тапов в левом верхнем углу
  let taps = [];
  addEventListener('pointerdown', e => {
    if (e.clientX > 80 || e.clientY > 80) return;
    const now = Date.now(); taps = taps.filter(t => now - t < 1800); taps.push(now);
    if (taps.length >= 5) { taps = []; toggle(); }
  });
})();
</script>
</body>
